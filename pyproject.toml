[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceswitch"
version = "0.2.0"
description = "Dependency-free synthetic regression checks for evidence-sensitive LLM answers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "EvidenceSwitch contributors"}]
dependencies = []

[project.scripts]
evidenceswitch = "evidenceswitch.cli:main"

[tool.setuptools.packages.find]
include = ["evidenceswitch*"]
